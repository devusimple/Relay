    </header>

    <form class="card wide urlbar" id="form" autocomplete="off">
      <div class="row" style="display:contents">
        <select id="method" aria-label="HTTP method">
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>PATCH</option>
          <option>DELETE</option>
          <option>HEAD</option>
          <option>OPTIONS</option>
        </select>
        <input type="text" id="url" inputmode="url" placeholder="https://api.example.com/v1/users"
          aria-label="Request URL" value="https://jsonplaceholder.typicode.com/posts">
        <button class="send" id="send" type="submit">Send</button>
      </div>
    </form>

    <section class="card" aria-label="Request">
      <div class="tabs" role="tablist" id="reqTabs">
        <button class="tab" role="tab" aria-selected="true" data-p="params">Params<span class="n"
            id="n-params">0</span></button>
        <button class="tab" role="tab" aria-selected="false" data-p="auth">Auth</button>
        <button class="tab" role="tab" aria-selected="false" data-p="headers">Headers<span class="n"
            id="n-headers">0</span></button>
        <button class="tab" role="tab" aria-selected="false" data-p="body">Body</button>
      </div>

      <div class="panel on" id="p-params">
        <div class="kv" id="kv-params"></div>
        <button type="button" class="add" data-add="params">+ Add query parameter</button>
      </div>

      <div class="panel" id="p-auth">
        <div class="field"><label for="authType">Type</label>
          <select id="authType" style="width:100%;font-family:var(--sans);font-size:16px;font-weight:500">
            <option value="none">No auth</option>
            <option value="bearer">Bearer token</option>
            <option value="basic">Basic auth</option>
            <option value="apikey">API key</option>
          </select>
        </div>
        <div id="authFields"></div>
      </div>

      <div class="panel" id="p-headers">
        <div class="kv" id="kv-headers"></div>
        <button type="button" class="add" data-add="headers">+ Add header</button>
      </div>

      <div class="panel" id="p-body">
        <div class="seg" id="bodyType" role="group" aria-label="Body type">
          <button type="button" data-t="none" aria-pressed="true">None</button>
          <button type="button" data-t="json" aria-pressed="false">JSON</button>
          <button type="button" data-t="form" aria-pressed="false">Form data</button>
          <button type="button" data-t="urlenc" aria-pressed="false">URL-encoded</button>
          <button type="button" data-t="raw" aria-pressed="false">Raw</button>
        </div>
        <div id="b-none" class="hint">This request has no body.</div>
        <div id="b-json" hidden>
          <textarea id="json" spellcheck="false" placeholder='{"title":"Hello","userId":1}'
            aria-label="JSON body"></textarea>
          <div class="tools"><button type="button" class="ghost" id="fmt">Format</button><button type="button"
              class="ghost" id="min">Minify</button><span class="err-text" id="jerr"></span></div>
        </div>
        <div id="b-form" hidden>
          <div class="kv" id="kv-form"></div>
          <button type="button" class="add" data-add="form">+ Add field</button>
          <p class="hint">Sent as multipart/form-data. Choose "File" on a row to attach a file.</p>
        </div>
        <div id="b-urlenc" hidden>
          <div class="kv" id="kv-urlenc"></div>
          <button type="button" class="add" data-add="urlenc">+ Add field</button>
        </div>
        <div id="b-raw" hidden>
          <textarea id="raw" spellcheck="false" placeholder="Plain text, XML, GraphQL…"
            aria-label="Raw body"></textarea>
        </div>
      </div>
    </section>

    <section class="card" aria-label="Response" id="resCard">
      <div id="resEmpty" class="empty"><b>No response yet</b>Press Send to see status, headers and body here.</div>
      <div id="resBox" hidden>
        <div class="statusbar">
          <span class="badge" id="rStatus"></span>
          <span class="meta" id="rTime"></span><span class="meta" id="rSize"></span>
        </div>
        <div class="tabs" role="tablist" id="resTabs">
          <button class="tab" role="tab" aria-selected="true" data-r="body">Body</button>
          <button class="tab" role="tab" aria-selected="false" data-r="headers">Headers<span class="n"
              id="n-rh">0</span></button>
          <button class="tab" role="tab" aria-selected="false" data-r="preview">Preview</button>
          <button class="tab" role="tab" aria-selected="false" data-r="history">History</button>
        </div>
        <div class="panel on" id="r-body">
          <pre class="out" id="rBody"></pre>
          <div class="tools"><button class="ghost" id="copy">Copy</button><button class="ghost"
              id="dl">Download</button><button class="ghost" id="wrap">Toggle wrap</button></div>
        </div>
        <div class="panel" id="r-headers">
          <table class="hdr-table" id="rHeaders"></table>
        </div>
        <div class="panel" id="r-preview"><iframe class="preview" id="rPrev" sandbox title="Response preview"></iframe>
        </div>
        <div class="panel" id="r-history">
          <div class="hist" id="hist"></div>
        </div>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>

</html>
